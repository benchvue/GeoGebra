<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pythagorean Theorem — Interactive</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1008;
    --paper: #f5f0e8;
    --amber: #c8860a;
    --gold: #e8c84a;
    --green: #3a8a3a;
    --blue: #2a62a8;
    --red: #c0392b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: repeating-linear-gradient(
      transparent, transparent 31px,
      rgba(180,160,120,0.13) 31px, rgba(180,160,120,0.13) 32px
    );
    pointer-events: none; z-index: 0;
  }
  header {
    text-align: center;
    padding: 1.4rem 1rem 0.3rem;
    position: relative; z-index: 1;
  }
  header h1 { font-size: clamp(1.4rem,3vw,2.2rem); font-weight:600; letter-spacing:-0.02em; }
  header h1 span { color: var(--amber); font-style: italic; }
  header p { font-size: 0.88rem; color: #6b5a3a; font-style: italic; margin-top:0.2rem; }

  .container {
    position: relative; z-index: 1;
    max-width: 860px;
    margin: 0.8rem auto;
    padding: 0 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }

  .canvas-wrap {
    background: rgba(255,255,255,0.55);
    border: 1.5px solid rgba(26,16,8,0.13);
    border-radius: 3px;
    padding: 4px;
    backdrop-filter: blur(4px);
    width: 100%;
    max-width: 820px;
  }
  canvas { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: none; }

  .eq-panel {
    width: 100%;
    max-width: 820px;
    background: rgba(255,255,255,0.6);
    border: 1.5px solid rgba(26,16,8,0.13);
    border-radius: 2px;
    padding: 1rem 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .eq-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.63rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--amber);
    display: flex; align-items: center; gap: 0.5rem;
  }
  .eq-label::after { content:''; flex:1; height:1px; background:rgba(200,134,10,0.3); }
  .eq-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
  }
  .eq-box {
    padding: 0.38rem 0.8rem;
    border: 2px solid;
    font-weight: 700;
    border-radius: 2px;
    min-width: 80px;
    text-align: center;
    transition: all 0.2s;
  }
  .eq-a     { border-color: var(--green); color: var(--green); }
  .eq-b     { border-color: var(--blue);  color: var(--blue);  }
  .eq-sum   { border-color: var(--ink);   color: var(--ink);   }
  .eq-c-left  { border-color: var(--red); color: var(--red); }
  .eq-c-right { border-color: var(--red); color: var(--red); background: rgba(192,57,43,0.08); }
  .eq-op { color: var(--ink); font-size: 1.15rem; }

  .match-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    color: #2e7d32;
    text-align: center;
    font-weight: 700;
  }
  .hint { font-size: 0.78rem; color: #888; text-align: center; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Pythagorean <span>Theorem</span></h1>
  <p>Diameter = 10 units · Drag the purple point · a² + b² = c²</p>
</header>

<div class="container">
  <div class="canvas-wrap">
    <canvas id="c" width="820" height="820"></canvas>
  </div>
  <div class="eq-panel">
    <div class="eq-label">Live Equation</div>
    <div class="eq-row">
      <div class="eq-box eq-a"     id="ea">a² = ?</div>
      <span class="eq-op">+</span>
      <div class="eq-box eq-b"     id="eb">b² = ?</div>
      <span class="eq-op">=</span>
      <div class="eq-box eq-sum"   id="esum">?</div>
      <span class="eq-op">│</span>
      <div class="eq-box eq-c-left"  id="ec1">c² = ?</div>
      <span class="eq-op">=</span>
      <div class="eq-box eq-c-right" id="ec2">?</div>
    </div>
    <div class="match-label" id="matchlbl"></div>
    <div class="hint">🖱 Drag the <strong>purple point B</strong> around the circle — the right angle stays at B (Thales' theorem)</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const W = 820, H = 820;

// ── unit system ──────────────────────────────────────────────
// Diameter = 10 units  →  radius = 5 units
// We keep a padding so the outward squares never leave the canvas.
// The largest square is on the hypotenuse (= diameter = 10 u),
// so it has area 100 u².  Its side projects ~10 u in each direction.
// Give each side at least 10 u of runway.
// Canvas = 820 px.  usable = 820 - 2*pad.
// circle diameter px = usable - 2*(max_square_side_px)
// Let SCALE = px per unit.  diameter_px = 10*SCALE.
// max extra room needed on each side ≈ 10*SCALE (hyp square half-width).
// So: 10*SCALE + 2*10*SCALE = 820 - 2*pad  →  SCALE ≈ 22 with pad=40

const PAD   = 40;          // canvas edge padding px
const SCALE = 22;          // px per unit  (1 unit = 22 px)
const R_PX  = 5 * SCALE;   // radius in px  = 110 px
// Center placed so the circle + its biggest square (hyp, going left) fits
// Hyp square goes upper-left; leg squares go below and right.
// After experimentation: center at (W/2 + 20, H/2 - 10)
const CX = Math.round(W / 2 + 20);
const CY = Math.round(H / 2 -  0);

// Diameter endpoints (A left, C right) on horizontal axis
const A = { x: CX - R_PX, y: CY };
const C = { x: CX + R_PX, y: CY };

let angle = -Math.PI * 0.62;   // starting angle for B

// ── helpers ─────────────────────────────────────────────────
const dist = (p,q) => Math.hypot(p.x-q.x, p.y-q.y);

function getB() {
  return { x: CX + R_PX * Math.cos(angle), y: CY + R_PX * Math.sin(angle) };
}

// Draw a square outward from edge p1→p2 and return its centre
function drawSquare(p1, p2, fill, stroke) {
  const dx = p2.x-p1.x, dy = p2.y-p1.y;
  // Two perpendicular candidates
  const nx1 = -dy, ny1 =  dx;   // CCW 90°
  const nx2 =  dy, ny2 = -dx;   // CW  90°
  // Pick the one pointing AWAY from triangle centroid
  const B = getB();
  const cx = (A.x+B.x+C.x)/3, cy = (A.y+B.y+C.y)/3;
  const mx = (p1.x+p2.x)/2,   my = (p1.y+p2.y)/2;
  const d1 = nx1*(cx-mx)+ny1*(cy-my);
  const nx = d1 < 0 ? nx1 : nx2;
  const ny = d1 < 0 ? ny1 : ny2;

  const x1=p1.x, y1=p1.y;
  const x2=p2.x, y2=p2.y;
  const x3=p2.x+nx, y3=p2.y+ny;
  const x4=p1.x+nx, y4=p1.y+ny;

  ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
  ctx.closePath();
  ctx.fillStyle = fill;   ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke();

  return { x:(x1+x2+x3+x4)/4, y:(y1+y2+y3+y4)/4 };
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const B = getB();

  const a = dist(A, B);
  const b = dist(B, C);
  const c = dist(A, C);   // always 2*R_PX = diameter

  // ── circle (dashed) ──
  ctx.save();
  ctx.setLineDash([7,5]);
  ctx.beginPath(); ctx.arc(CX, CY, R_PX, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(160,140,100,0.40)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();

  // ── diameter guide ──
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(C.x,C.y);
  ctx.strokeStyle='rgba(160,140,100,0.25)'; ctx.lineWidth=1; ctx.stroke();

  // ── squares (drawn first so triangle renders on top) ──
  const gCen = drawSquare(A, B, 'rgba(100,200,100,0.22)', '#3a8a3a');  // green on a
  const bCen = drawSquare(B, C, 'rgba(100,150,230,0.20)', '#2a62a8');  // blue  on b
  const rCen = drawSquare(A, C, 'rgba(220,80,80,0.16)',   '#c0392b');  // red   on c

  // ── triangle ──
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y); ctx.closePath();
  ctx.fillStyle='rgba(200,134,10,0.10)'; ctx.fill();
  const sides = [[A,B,'#3a8a3a',2.5],[B,C,'#2a62a8',2.5],[A,C,'#c0392b',2.5]];
  sides.forEach(([p,q,col,lw])=>{
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y);
    ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke();
  });

  // ── right-angle box at B ──
  const sz=11;
  const al=dist(A,B)||1, bl=dist(C,B)||1;
  const u1x=(A.x-B.x)/al*sz, u1y=(A.y-B.y)/al*sz;
  const u2x=(C.x-B.x)/bl*sz, u2y=(C.y-B.y)/bl*sz;
  ctx.beginPath();
  ctx.moveTo(B.x+u1x,B.y+u1y);
  ctx.lineTo(B.x+u1x+u2x,B.y+u1y+u2y);
  ctx.lineTo(B.x+u2x,B.y+u2y);
  ctx.strokeStyle='#555'; ctx.lineWidth=1.5; ctx.stroke();

  // ── square area labels ──
  const aU = a/SCALE, bU = b/SCALE, cU = c/SCALE;
  function sqLabel(cen, val, col) {
    ctx.save();
    ctx.font = `bold 15px 'Crimson Pro',Georgia,serif`;
    ctx.fillStyle = col; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(val.toFixed(2), cen.x, cen.y);
    ctx.restore();
  }
  sqLabel(gCen, aU*aU, '#3a8a3a');
  sqLabel(bCen, bU*bU, '#2a62a8');
  sqLabel(rCen, cU*cU, '#c0392b');

  // ── side labels (units) ──
  function sideLabel(p, q, text, col, off=20) {
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
    const dx=q.x-p.x, dy=q.y-p.y, len=Math.sqrt(dx*dx+dy*dy)||1;
    const nx=-dy/len, ny=dx/len;
    const cx2=(A.x+B.x+C.x)/3, cy2=(A.y+B.y+C.y)/3;
    const sign=(nx*(cx2-mx)+ny*(cy2-my))>0?-1:1;
    ctx.save();
    ctx.font=`italic 600 13px 'Crimson Pro',Georgia,serif`;
    ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text, mx+sign*nx*off, my+sign*ny*off);
    ctx.restore();
  }
  sideLabel(A, B, `a=${aU.toFixed(2)}`, '#3a8a3a');
  sideLabel(B, C, `b=${bU.toFixed(2)}`, '#2a62a8');
  sideLabel(A, C, `c=10.00`,            '#c0392b', 18);

  // ── diameter label ──
  ctx.save();
  ctx.font=`italic 11px 'Crimson Pro',Georgia,serif`;
  ctx.fillStyle='rgba(160,140,100,0.7)'; ctx.textAlign='center';
  ctx.fillText('diameter = 10', CX, CY+R_PX+16);
  ctx.restore();

  // ── vertex dots ──
  [[A,'#888',5],[C,'#888',5],[B,'#7c3aed',9]].forEach(([p,col,r])=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle=col; ctx.fill();
    if(r>5){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
  });

  // ── vertex labels ──
  ctx.save();
  ctx.font=`700 12px 'JetBrains Mono',monospace`;
  ctx.fillStyle='#444'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('A', A.x, A.y-16);
  ctx.fillText('C', C.x, C.y-16);
  const bOff = B.y < CY ? 16 : -16;
  ctx.fillText('B', B.x, B.y + bOff);
  ctx.restore();

  // ── equation panel ──
  const a2 = aU*aU, b2 = bU*bU, c2 = cU*cU, sum = a2+b2;
  document.getElementById('ea').textContent   = `a² = ${a2.toFixed(2)}`;
  document.getElementById('eb').textContent   = `b² = ${b2.toFixed(2)}`;
  document.getElementById('esum').textContent = sum.toFixed(2);
  document.getElementById('ec1').textContent  = `c² = ${c2.toFixed(2)}`;
  document.getElementById('ec2').textContent  = c2.toFixed(2);
  document.getElementById('matchlbl').textContent =
    `✓  ${a2.toFixed(2)} + ${b2.toFixed(2)} = ${sum.toFixed(2)}  =  c² (${c2.toFixed(2)})  — always equal!`;
}

// ── interaction ─────────────────────────────────────────────
let dragging = false;
function getPt(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = W/rect.width, sy = H/rect.height;
  const src = e.touches ? e.touches[0] : e;
  return { x:(src.clientX-rect.left)*sx, y:(src.clientY-rect.top)*sy };
}
function clampAngle(a) {
  // avoid degenerate (near 0° or 180° where B lands on A or C)
  const eps = 0.07;
  if (Math.abs(a)        < eps) return eps;
  if (Math.abs(a-Math.PI)< eps) return Math.PI-eps;
  if (Math.abs(a+Math.PI)< eps) return -Math.PI+eps;
  return a;
}
canvas.addEventListener('mousedown', e=>{
  const pt=getPt(e), B=getB();
  if(Math.hypot(pt.x-B.x,pt.y-B.y)<22) dragging=true;
});
canvas.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const pt=getPt(e);
  angle=clampAngle(Math.atan2(pt.y-CY, pt.x-CX));
  draw();
});
canvas.addEventListener('mouseup',   ()=>dragging=false);
canvas.addEventListener('mouseleave',()=>dragging=false);
canvas.addEventListener('touchstart', e=>{ e.preventDefault();
  const pt=getPt(e), B=getB();
  if(Math.hypot(pt.x-B.x,pt.y-B.y)<28) dragging=true;
},{passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault();
  if(!dragging) return;
  const pt=getPt(e);
  angle=clampAngle(Math.atan2(pt.y-CY,pt.x-CX));
  draw();
},{passive:false});
canvas.addEventListener('touchend',()=>dragging=false);

draw();
</script>
</body>
</html>
