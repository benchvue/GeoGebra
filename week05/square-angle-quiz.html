<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Angle Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #container {
            background: white;
            padding: 36px 40px 32px;
            border-radius: 14px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.10);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 520px;
            width: 100%;
        }

        h1 {
            font-size: 22px;
            color: #333;
            text-align: center;
            font-weight: bold;
            line-height: 1.4;
        }
        h1 span { color: #2563eb; }

        #subtitle {
            font-size: 15px;
            color: #666;
            text-align: center;
        }

        canvas {
            border: 1px solid #ddd;
            border-radius: 8px;
            display: block;
        }

        /* ── Sum card ── */
        #sum-card {
            width: 100%;
            background: #f0fdf4;
            border: 2px solid #10b981;
            border-radius: 12px;
            padding: 16px 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s, transform 0.4s;
        }
        #sum-card.show {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .sum-title {
            font-size: 13px;
            color: #065f46;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .sum-equation {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .angle-chip {
            background: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 15px;
            padding: 5px 11px;
            border-radius: 8px;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.3s, transform 0.3s;
        }
        .angle-chip.pop { opacity: 1; transform: scale(1); }

        .plus-sign {
            color: #6b7280;
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .plus-sign.show { opacity: 1; }

        .equals-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .equals-row.show { opacity: 1; }

        .equals-line {
            flex: 1;
            height: 2px;
            background: #10b981;
            border-radius: 2px;
        }

        .total-value {
            font-size: 26px;
            font-weight: bold;
            color: #10b981;
        }

        .total-label {
            font-size: 13px;
            color: #065f46;
        }

        /* ── Button ── */
        #btn-answer {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 13px 38px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.18s, transform 0.1s;
            letter-spacing: 0.5px;
        }
        #btn-answer:hover  { background: #1d4ed8; transform: translateY(-1px); }
        #btn-answer:active { transform: translateY(0); }
        #btn-answer.revealed       { background: #10b981; }
        #btn-answer.revealed:hover { background: #059669; }
    </style>
</head>
<body>
<div id="container">
    <h1>How much is each <span>internal angle</span><br>inside a square?</h1>
    <div id="subtitle">Each corner has a <strong>?</strong> — can you guess the angle?</div>

    <canvas id="canvas" width="380" height="380"></canvas>

    <!-- Angle sum card -->
    <div id="sum-card">
        <div class="sum-title">🔢 Internal Angle Sum</div>
        <div class="sum-equation">
            <span class="angle-chip" id="c1">90°</span>
            <span class="plus-sign" id="p1">+</span>
            <span class="angle-chip" id="c2">90°</span>
            <span class="plus-sign" id="p2">+</span>
            <span class="angle-chip" id="c3">90°</span>
            <span class="plus-sign" id="p3">+</span>
            <span class="angle-chip" id="c4">90°</span>
        </div>
        <div class="equals-row" id="equals-row">
            <div class="equals-line"></div>
            <div class="total-value">= 360°</div>
            <div class="equals-line"></div>
        </div>
        <div class="total-label" id="total-label" style="opacity:0;transition:opacity 0.4s">
            ✅ A square's internal angles always add up to <strong>360°</strong>
        </div>
    </div>

    <button id="btn-answer" onclick="revealAnswer()">Show Answer</button>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const btn    = document.getElementById('btn-answer');
    const sumCard = document.getElementById('sum-card');

    let revealed = false;

    const W   = canvas.width;
    const H   = canvas.height;
    const pad = 70;
    const sq  = W - pad * 2;
    const offset = 36;

    const corners = [
        { x: pad,      y: pad,      labelX: pad + offset,    labelY: pad + offset    },
        { x: pad + sq, y: pad,      labelX: pad + sq - offset, labelY: pad + offset  },
        { x: pad + sq, y: pad + sq, labelX: pad + sq - offset, labelY: pad + sq - offset },
        { x: pad,      y: pad + sq, labelX: pad + offset,    labelY: pad + sq - offset },
    ];

    function draw(showAnswer) {
        ctx.clearRect(0, 0, W, H);

        // Fill
        ctx.fillStyle = 'rgba(37,99,235,0.06)';
        ctx.fillRect(pad, pad, sq, sq);

        // Border
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 4;
        ctx.setLineDash([]);
        ctx.strokeRect(pad, pad, sq, sq);

        const dirs = [[1,1],[-1,1],[-1,-1],[1,-1]];
        const s = 18;

        corners.forEach((c, i) => {
            const [dx, dy] = dirs[i];

            // Right-angle square
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(c.x + dx * s, c.y);
            ctx.lineTo(c.x + dx * s, c.y + dy * s);
            ctx.lineTo(c.x,          c.y + dy * s);
            ctx.stroke();

            // Label
            ctx.font         = showAnswer ? 'bold 19px Arial' : 'bold 24px Arial';
            ctx.textAlign    = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle    = '#10b981';
            ctx.fillText(showAnswer ? '90°' : '?', c.labelX, c.labelY);
        });

        // Centre label
        ctx.fillStyle    = '#333';
        ctx.font         = 'bold 16px Arial';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Square', W / 2, H / 2);

        // Inside sum equation when revealed
        if (showAnswer) {
            ctx.font      = 'bold 13px Arial';
            ctx.fillStyle = '#2563eb';
            ctx.fillText('90° + 90° + 90° + 90°', W / 2, H / 2 + 30);

            ctx.beginPath();
            ctx.moveTo(W / 2 - 82, H / 2 + 43);
            ctx.lineTo(W / 2 + 82, H / 2 + 43);
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth   = 1.5;
            ctx.stroke();

            ctx.font      = 'bold 18px Arial';
            ctx.fillStyle = '#10b981';
            ctx.fillText('= 360°', W / 2, H / 2 + 60);
        }
    }

    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function animateCard() {
        // Show card
        sumCard.style.display = 'flex';
        await delay(20);
        sumCard.classList.add('show');

        // Pop chips one by one
        const chips  = ['c1','c2','c3','c4'];
        const pluses = ['p1','p2','p3'];

        for (let i = 0; i < chips.length; i++) {
            await delay(200);
            document.getElementById(chips[i]).classList.add('pop');
            if (i < pluses.length) {
                await delay(100);
                document.getElementById(pluses[i]).classList.add('show');
            }
        }

        // Show equals row
        await delay(300);
        document.getElementById('equals-row').classList.add('show');

        // Show text
        await delay(300);
        document.getElementById('total-label').style.opacity = '1';
    }

    function resetCard() {
        sumCard.classList.remove('show');
        sumCard.style.display = 'none';
        ['c1','c2','c3','c4'].forEach(id => document.getElementById(id).classList.remove('pop'));
        ['p1','p2','p3'].forEach(id => document.getElementById(id).classList.remove('show'));
        document.getElementById('equals-row').classList.remove('show');
        document.getElementById('total-label').style.opacity = '0';
    }

    function revealAnswer() {
        if (revealed) {
            revealed = false;
            btn.textContent = 'Show Answer';
            btn.classList.remove('revealed');
            resetCard();
            draw(false);
        } else {
            revealed = true;
            btn.textContent = 'Try Again';
            btn.classList.add('revealed');
            draw(true);
            animateCard();
        }
    }

    draw(false);
</script>
</body>
</html>
