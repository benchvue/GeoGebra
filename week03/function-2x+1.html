<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Function Animation</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .function-box {
            width: 220px;
            height: 150px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border: 4px solid #2c3e50;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 2;
            transition: transform 0.1s ease;
        }

        .function-label {
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 8px;
        }

        .calc-display {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            background: rgba(255,255,255,0.92);
            padding: 6px 16px;
            border-radius: 8px;
            min-width: 80px;
            text-align: center;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .calc-display.pop {
            animation: calcPop 0.35s ease;
        }

        @keyframes calcPop {
            0% { transform: scale(0.7); opacity: 0.5; }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); opacity: 1; }
        }

        .function-formula {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
            font-weight: bold;
            margin-top: 6px;
            transition: opacity 0.3s, transform 0.3s, max-height 0.3s;
            overflow: hidden;
        }

        .function-formula.hidden {
            opacity: 0;
            transform: scale(0);
            max-height: 0;
        }

        .function-formula.visible {
            opacity: 1;
            transform: scale(1);
            max-height: 40px;
        }

        .arrow {
            width: 120px;
            height: 4px;
            background: #2c3e50;
            position: relative;
            flex-shrink: 0;
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -10px;
            top: -8px;
            width: 0;
            height: 0;
            border-left: 20px solid #2c3e50;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }

        .io-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            position: relative;
        }

        .value-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            height: 80px;
            justify-content: center;
        }

        .value-wrapper .label {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            margin-top: 10px;
        }

        .value {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .input-value {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        .output-value {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .moving-ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.35);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }

        .moving-ball.green {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        .moving-ball.blue {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .moving-ball.orange {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            70% { transform: translate(-50%, -50%) scale(1.15); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .label {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
        }

        .step-indicator {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-play { background: linear-gradient(135deg, #27ae60 0%, #229954 100%); }
        .btn-pause { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); }
        .btn-stop { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .btn-toggle { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:disabled:hover { transform: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="step-indicator" id="stepIndicator">Press Play to start</div>
        
        <div class="io-container" id="ioContainer">
            <div class="value-wrapper" id="inputWrapper">
                <div class="value input-value" id="inputValue">?</div>
                <div class="label">Input</div>
            </div>
            
            <div class="arrow" id="arrow1"></div>
            
            <div class="function-box" id="functionBox">
                <div class="function-label">f(x) = 2x + 1</div>
                <div class="calc-display" id="calcDisplay">f(x) = 2x + 1</div>
            </div>
            
            <div class="arrow" id="arrow2"></div>
            
            <div class="value-wrapper" id="outputWrapper">
                <div class="value output-value" id="outputValue">?</div>
                <div class="label">Output</div>
            </div>

            <div class="moving-ball green" id="movingBall">0</div>
        </div>

        <div class="controls">
            <button class="btn btn-play" id="playBtn" onclick="play()">Play</button>
            <button class="btn btn-pause" id="pauseBtn" onclick="pause()" disabled>Pause</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stop()" disabled>Stop</button>
        </div>
    </div>

    <script>
        // f(x) = 2x + 1
        const steps = [
            { input: 0, output: 1 },
            { input: 1, output: 3 },
            { input: 2, output: 5 },
            { input: 3, output: 7 }
        ];

        let currentStep = 0;
        let isPlaying = false;
        let isFormulaVisible = false;
        let animationInProgress = false;
        let timeouts = [];

        function clearAllTimeouts() {
            timeouts.forEach(t => clearTimeout(t));
            timeouts = [];
        }

        function addTimeout(fn, delay) {
            const t = setTimeout(fn, delay);
            timeouts.push(t);
            return t;
        }

        function getCenter(el) {
            const container = document.getElementById('ioContainer');
            const cRect = container.getBoundingClientRect();
            const eRect = el.getBoundingClientRect();
            return {
                x: eRect.left + eRect.width / 2 - cRect.left,
                y: eRect.top + eRect.height / 2 - cRect.top
            };
        }

        function setCalcText(text) {
            const calc = document.getElementById('calcDisplay');
            calc.textContent = text;
            calc.classList.remove('pop');
            requestAnimationFrame(() => {
                calc.classList.add('pop');
            });
        }

        function animateStep() {
            if (animationInProgress) return;
            animationInProgress = true;

            const step = steps[currentStep];
            const ball = document.getElementById('movingBall');
            const inputEl = document.getElementById('inputValue');
            const outputEl = document.getElementById('outputValue');
            const stepEl = document.getElementById('stepIndicator');
            const functionBox = document.getElementById('functionBox');

            stepEl.textContent = `Step ${currentStep + 1}: Input ${step.input} → Output ?`;

            setCalcText('f(x) = 2x + 1');

            inputEl.textContent = step.input;
            inputEl.style.animation = 'none';
            requestAnimationFrame(() => { inputEl.style.animation = 'pulse 0.4s ease'; });

            const inputPos = getCenter(document.getElementById('inputWrapper'));
            const boxPos = getCenter(functionBox);
            const outputPos = getCenter(document.getElementById('outputWrapper'));

            // Phase 1: Green ball pops in at input
            ball.textContent = step.input;
            ball.className = 'moving-ball green';
            ball.style.transition = 'none';
            ball.style.left = inputPos.x + 'px';
            ball.style.top = inputPos.y + 'px';
            ball.style.opacity = '1';
            ball.style.animation = 'popIn 0.35s ease forwards';

            // Phase 2: Ball slides to f(x) box
            addTimeout(() => {
                ball.style.animation = '';
                ball.style.transform = 'translate(-50%, -50%) scale(1)';
                ball.style.transition = 'left 0.7s cubic-bezier(0.4,0,0.2,1), top 0.7s cubic-bezier(0.4,0,0.2,1)';
                ball.style.left = boxPos.x + 'px';
                ball.style.top = boxPos.y + 'px';
            }, 600);

            // Phase 3: Ball enters box
            addTimeout(() => {
                ball.className = 'moving-ball orange';
                ball.style.transition = 'transform 0.25s ease';
                ball.style.transform = 'translate(-50%, -50%) scale(0.4)';
                ball.style.opacity = '0.5';

                functionBox.style.transform = 'scale(1.06)';
                addTimeout(() => {
                    functionBox.style.transform = 'scale(0.96)';
                    addTimeout(() => {
                        functionBox.style.transform = 'scale(1.02)';
                        addTimeout(() => {
                            functionBox.style.transform = 'scale(1)';
                        }, 100);
                    }, 100);
                }, 100);
            }, 1500);

            // Phase 4: Show f(input)
            addTimeout(() => {
                setCalcText(`f(${step.input})`);
            }, 2000);

            // Phase 5: Show 2×input + 1
            addTimeout(() => {
                setCalcText(`2 × ${step.input} + 1`);
            }, 2700);

            // Phase 6: Show = result
            addTimeout(() => {
                setCalcText(`= ${step.output}`);
                stepEl.textContent = `Step ${currentStep + 1}: Input ${step.input} → Output ${step.output}`;
            }, 3400);

            // Phase 7: Blue ball emerges
            addTimeout(() => {
                ball.textContent = step.output;
                ball.className = 'moving-ball blue';
                ball.style.opacity = '1';
                ball.style.transition = 'transform 0.3s ease-out';
                ball.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 4000);

            // Phase 8: Ball slides to output
            addTimeout(() => {
                ball.style.transition = 'left 0.7s cubic-bezier(0.4,0,0.2,1), top 0.7s cubic-bezier(0.4,0,0.2,1)';
                ball.style.left = outputPos.x + 'px';
                ball.style.top = outputPos.y + 'px';
            }, 4400);

            // Phase 9: Ball arrives, update output
            addTimeout(() => {
                outputEl.textContent = step.output;
                outputEl.style.animation = 'none';
                requestAnimationFrame(() => { outputEl.style.animation = 'pulse 0.4s ease'; });

                ball.style.animation = 'popOut 0.3s ease forwards';
            }, 5300);

            // Phase 10: Reset and advance
            addTimeout(() => {
                ball.style.opacity = '0';
                ball.style.animation = '';
                setCalcText('f(x) = 2x + 1');
                animationInProgress = false;
                currentStep = (currentStep + 1) % steps.length;
                if (isPlaying) {
                    addTimeout(animateStep, 600);
                }
            }, 5900);
        }

        function play() {
            if (!isPlaying) {
                isPlaying = true;
                document.getElementById('playBtn').disabled = true;
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('stopBtn').disabled = false;
                if (!animationInProgress) {
                    animateStep();
                }
            }
        }

        function pause() {
            if (isPlaying) {
                isPlaying = false;
                document.getElementById('playBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
            }
        }

        function stop() {
            isPlaying = false;
            animationInProgress = false;
            clearAllTimeouts();
            currentStep = 0;

            const ball = document.getElementById('movingBall');
            ball.style.transition = 'none';
            ball.style.opacity = '0';
            ball.style.animation = '';

            document.getElementById('inputValue').textContent = '?';
            document.getElementById('outputValue').textContent = '?';
            document.getElementById('stepIndicator').textContent = 'Press Play to start';
            document.getElementById('functionBox').style.transform = 'scale(1)';
            document.getElementById('calcDisplay').textContent = 'f(x) = 2x + 1';
            document.getElementById('calcDisplay').classList.remove('pop');

            document.getElementById('playBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('stopBtn').disabled = true;
        }

        function toggleFormula() {
            const formula = document.getElementById('formula');
            const toggleBtn = document.getElementById('toggleBtn');
            isFormulaVisible = !isFormulaVisible;
            if (isFormulaVisible) {
                formula.classList.remove('hidden');
                formula.classList.add('visible');
                toggleBtn.textContent = 'Hide Rule';
            } else {
                formula.classList.remove('visible');
                formula.classList.add('hidden');
                toggleBtn.textContent = 'Show Rule';
            }
        }
    </script>
</body>
</html>
