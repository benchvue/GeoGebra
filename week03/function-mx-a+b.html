<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>f(x) = m(x−a) + b</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f5f0;
    color: #1a1a2e;
    font-family: 'Syne', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 20px;
    padding: 24px;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: #888;
    text-transform: uppercase;
  }

  .equation-box {
    background: #fff;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    padding: 10px 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #111;
    box-shadow: 0 2px 12px #0001;
  }

  .equation-box .vm { color: #333; }
  .equation-box .va { color: #2563eb; }
  .equation-box .vb { color: #dc2626; }

  canvas {
    border: 1.5px solid #ccc;
    border-radius: 6px;
    background: #fff;
    box-shadow: 0 4px 24px #0001;
    cursor: crosshair;
  }

  .controls {
    display: flex;
    gap: 20px;
    align-items: stretch;
    flex-wrap: wrap;
    justify-content: center;
  }

  .slider-group {
    background: #fff;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 190px;
    box-shadow: 0 2px 8px #0001;
  }

  .slider-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .slider-label .name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: #555;
  }

  .slider-label .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.05rem;
    font-weight: 600;
    min-width: 38px;
    text-align: right;
  }

  .desc {
    font-size: 0.72rem;
    color: #999;
    font-family: 'JetBrains Mono', monospace;
    margin-top: -4px;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  /* M slider - dark */
  .m-track { background: #ddd; }
  .m-track::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    background: #222;
    border-radius: 50%;
    box-shadow: 0 0 0 3px #fff, 0 0 0 4px #222;
    transition: transform 0.12s;
  }
  .m-track::-webkit-slider-thumb:hover { transform: scale(1.25); }
  .vm { color: #222; }

  /* A slider - blue */
  .a-track { background: #bfdbfe; }
  .a-track::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    background: #2563eb;
    border-radius: 50%;
    box-shadow: 0 0 0 3px #fff, 0 0 0 4px #2563eb;
    transition: transform 0.12s;
  }
  .a-track::-webkit-slider-thumb:hover { transform: scale(1.25); }
  .va { color: #2563eb; }

  /* B slider - red */
  .b-track { background: #fecaca; }
  .b-track::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    background: #dc2626;
    border-radius: 50%;
    box-shadow: 0 0 0 3px #fff, 0 0 0 4px #dc2626;
    transition: transform 0.12s;
  }
  .b-track::-webkit-slider-thumb:hover { transform: scale(1.25); }
  .vb { color: #dc2626; }
</style>
</head>
<body>

<h1>Linear Function Visualizer</h1>

<div class="equation-box" id="eqBox">
  f(x) = <span class="vm" id="eqM">2</span>(x − <span class="va" id="eqA">0</span>) + <span class="vb" id="eqB">0</span>
</div>

<canvas id="graph" width="560" height="560"></canvas>

<div class="controls">
  <div class="slider-group">
    <div class="slider-label">
      <span class="name">m &nbsp;<span style="color:#aaa;font-size:0.75rem">(slope)</span></span>
      <span class="value vm" id="mVal">2</span>
    </div>
    <input type="range" class="m-track" id="mSlider" min="-5" max="5" step="0.1" value="2">
    <div class="desc">▲ right-angle triangle on graph</div>
  </div>

  <div class="slider-group">
    <div class="slider-label">
      <span class="name">a &nbsp;<span style="color:#aaa;font-size:0.75rem">(x-intercept)</span></span>
      <span class="value va" id="aVal">0</span>
    </div>
    <input type="range" class="a-track" id="aSlider" min="-5" max="5" step="0.1" value="0">
    <div class="desc">● blue point on x-axis</div>
  </div>

  <div class="slider-group">
    <div class="slider-label">
      <span class="name">b &nbsp;<span style="color:#aaa;font-size:0.75rem">(y-intercept shift)</span></span>
      <span class="value vb" id="bVal">0</span>
    </div>
    <input type="range" class="b-track" id="bSlider" min="-5" max="5" step="0.1" value="0">
    <div class="desc">● red point on y-axis</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('graph');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const PAD = 52;
  const RANGE = 7;

  function toCanvas(x, y) {
    const cx = PAD + (x + RANGE) / (2 * RANGE) * (W - 2 * PAD);
    const cy = PAD + (RANGE - y) / (2 * RANGE) * (H - 2 * PAD);
    return [cx, cy];
  }

  function fromCanvas(cx, cy) {
    const x = (cx - PAD) / (W - 2 * PAD) * 2 * RANGE - RANGE;
    const y = RANGE - (cy - PAD) / (H - 2 * PAD) * 2 * RANGE;
    return [x, y];
  }

  function fmt(v) {
    const n = parseFloat(v.toFixed(1));
    return (n % 1 === 0 ? n.toFixed(0) : n.toFixed(1));
  }

  function draw(m, a, b) {
    ctx.clearRect(0, 0, W, H);

    // White background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = '#e8e8e8';
    ctx.lineWidth = 1;
    for (let i = -RANGE; i <= RANGE; i++) {
      const [x1, y1] = toCanvas(i, -RANGE);
      const [x2, y2] = toCanvas(i, RANGE);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const [a1, b1] = toCanvas(-RANGE, i);
      const [a2, b2] = toCanvas(RANGE, i);
      ctx.beginPath(); ctx.moveTo(a1, b1); ctx.lineTo(a2, b2); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.8;
    const [ax1, ay] = toCanvas(-RANGE, 0);
    const [ax2]     = toCanvas(RANGE, 0);
    ctx.beginPath(); ctx.moveTo(ax1, ay); ctx.lineTo(ax2, ay); ctx.stroke();
    const [axo, ay1] = toCanvas(0, -RANGE);
    const [,    ay2] = toCanvas(0, RANGE);
    ctx.beginPath(); ctx.moveTo(axo, ay1); ctx.lineTo(axo, ay2); ctx.stroke();

    // Axis arrows
    ctx.fillStyle = '#000';
    const [arx, ary] = toCanvas(RANGE, 0);
    ctx.beginPath(); ctx.moveTo(arx, ary); ctx.lineTo(arx-9, ary-5); ctx.lineTo(arx-9, ary+5); ctx.closePath(); ctx.fill();
    const [ayx, ayy] = toCanvas(0, RANGE);
    ctx.beginPath(); ctx.moveTo(ayx, ayy); ctx.lineTo(ayx-5, ayy+9); ctx.lineTo(ayx+5, ayy+9); ctx.closePath(); ctx.fill();

    // Axis tick labels
    ctx.fillStyle = '#444';
    ctx.font = '11px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    for (let i = -6; i <= 6; i++) {
      if (i === 0) continue;
      const [cx, cy] = toCanvas(i, 0);
      ctx.fillText(i, cx, cy + 15);
      ctx.textAlign = 'right';
      const [cx2, cy2] = toCanvas(0, i);
      ctx.fillText(i, cx2 - 6, cy2 + 4);
      ctx.textAlign = 'center';
    }

    // Axis name labels
    ctx.fillStyle = '#000';
    ctx.font = 'bold 13px Syne, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('x', arx + 5, ary + 5);
    ctx.fillText('y', ayx + 6, ayy + 4);

    // Draw the line f(x) = m(x-a)+b
    ctx.save();
    ctx.beginPath();
    ctx.rect(PAD, PAD, W - 2*PAD, H - 2*PAD);
    ctx.clip();

    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    let started = false;
    for (let px = PAD; px <= W - PAD; px++) {
      const [x] = fromCanvas(px, 0);
      const y = m * (x - a) + b;
      const [, cy] = toCanvas(x, y);
      if (!started) { ctx.moveTo(px, cy); started = true; }
      else ctx.lineTo(px, cy);
    }
    ctx.stroke();
    ctx.restore();

    // ─── Right-angle slope triangle ───
    // Place it 1 unit to the right of point (a, b)
    const triX1 = a + 1;
    const triX2 = a + 2;
    const triY1 = m * (triX1 - a) + b;
    const triY2 = m * (triX2 - a) + b;

    const [cx1, cy1] = toCanvas(triX1, triY1);
    const [cx2, cy2] = toCanvas(triX2, triY2);
    const [cx3, cy3] = toCanvas(triX2, triY1); // right angle corner

    // Triangle fill
    ctx.fillStyle = 'rgba(100, 100, 200, 0.08)';
    ctx.beginPath();
    ctx.moveTo(cx1, cy1);
    ctx.lineTo(cx3, cy3);
    ctx.lineTo(cx2, cy2);
    ctx.closePath();
    ctx.fill();

    // Triangle edges
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(cx1, cy1);
    ctx.lineTo(cx3, cy3);
    ctx.lineTo(cx2, cy2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Right-angle mark at cx3, cy3
    const sz = 7;
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx3 - sz, cy3);
    ctx.lineTo(cx3 - sz, cy3 - sz * Math.sign(cy1 - cy3 || -1));
    ctx.lineTo(cx3, cy3 - sz * Math.sign(cy1 - cy3 || -1));
    ctx.stroke();

    // Labels: Δx = 1, Δy = m
    ctx.fillStyle = '#444';
    ctx.font = '11px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    const midX = (cx1 + cx3) / 2;
    const belowSign = cy3 > cy1 ? 14 : -6;
    ctx.fillText('Δx=1', midX, cy3 + belowSign);

    ctx.textAlign = 'left';
    const mLabel = fmt(m);
    const labelSign = cx2 < cx3 ? -10 - ctx.measureText('Δy='+mLabel).width : 6;
    ctx.fillText(`Δy=${mLabel}`, cx3 + 6, (cy2 + cy3) / 2 + 4);

    // ─── Green dot: point (a, b) on the line ───
    const [gpx, gpy] = toCanvas(a, b);
    ctx.beginPath();
    ctx.arc(gpx, gpy, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#16a34a';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Label
    ctx.fillStyle = '#16a34a';
    ctx.font = 'bold 11px JetBrains Mono, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`(${fmt(a)}, ${fmt(b)})`, gpx + 11, gpy - 8);

    // ─── Blue dot: point (a, 0) on x-axis ───
    const [adx, ady] = toCanvas(a, 0);
    ctx.beginPath();
    ctx.arc(adx, ady, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#2563eb';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Label
    ctx.fillStyle = '#2563eb';
    ctx.font = 'bold 11px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`a=${fmt(a)}`, adx, ady + 22);

    // ─── Red dot: point (0, b) on y-axis ───
    // The actual y-intercept of f(x)=m(x-a)+b at x=0 is: m*(0-a)+b = -m*a+b
    // But b is "y-intercept shift" — the red dot tracks b directly on y-axis as labeled
    const [bdx, bdy] = toCanvas(0, b);
    ctx.beginPath();
    ctx.arc(bdx, bdy, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#dc2626';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Label
    ctx.fillStyle = '#dc2626';
    ctx.font = 'bold 11px JetBrains Mono, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`b=${fmt(b)}`, bdx - 12, bdy + 4);
  }

  function getVals() {
    return {
      m: parseFloat(document.getElementById('mSlider').value),
      a: parseFloat(document.getElementById('aSlider').value),
      b: parseFloat(document.getElementById('bSlider').value),
    };
  }

  function updateEquation(m, a, b) {
    const mStr = fmt(m);
    const aStr = fmt(Math.abs(a));
    const bStr = fmt(Math.abs(b));
    const aSign = a >= 0 ? '−' : '+';
    const bSign = b >= 0 ? '+' : '−';

    document.getElementById('eqBox').innerHTML =
      `f(x) = <span class="vm">${mStr}</span>(x ${aSign} <span class="va">${aStr}</span>) ${bSign} <span class="vb">${bStr}</span>`;
  }

  function update() {
    const { m, a, b } = getVals();
    document.getElementById('mVal').textContent = fmt(m);
    document.getElementById('aVal').textContent = fmt(a);
    document.getElementById('bVal').textContent = fmt(b);
    updateEquation(m, a, b);
    draw(m, a, b);
  }

  document.getElementById('mSlider').addEventListener('input', update);
  document.getElementById('aSlider').addEventListener('input', update);
  document.getElementById('bSlider').addEventListener('input', update);

  update();
</script>
</body>
</html>
