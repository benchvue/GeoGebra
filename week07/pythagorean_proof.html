<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>x² + y² = 25</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400;600&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Lora', serif;
    background: #0d0f14;
    color: #dde2ee;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* ── Top nav bar (moved up) ── */
.nav {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 16px 28px;
    border-bottom: 1px solid #1e2535;
    background: #0d0f14;
}

.nav-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 0.07em;
    background: #151a24;
    color: #8899bb;
    border: 1px solid #252f45;
    border-radius: 8px;
    padding: 14px 48px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    user-select: none;
    min-width: 160px;
}
.nav-btn:hover:not(:disabled) { background: #1e2840; color: #c5d0e8; border-color: #4a5a7a; }
.nav-btn:active:not(:disabled) { transform: scale(0.97); }
.nav-btn:disabled { opacity: 0.2; cursor: default; }

.nav-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.step-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: #3d4a66;
    letter-spacing: 0.1em;
}

.dots { display: flex; align-items: center; gap: 14px; }
.dot-group { display: flex; gap: 5px; }
.dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #1e2535;
    transition: background 0.2s, transform 0.2s;
}
.dot.active { transform: scale(1.7); }

/* ── Main: two equal halves ── */
.main {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
}

/* ── LEFT: Circle ── */
.left {
    width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid #1e2535;
    padding: 12px;
}
canvas { display: block; }

/* ── RIGHT: Formula ── */
.right {
    width: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 28px;
    gap: 0;
}

.pt-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    margin-bottom: 24px;
    text-transform: uppercase;
    color: #3d4a66;
}

.formula-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
}

.fline {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lora', serif;
    font-weight: 400;
    line-height: 1;
    white-space: nowrap;
    padding: 10px 0;
}

/* Superscript — fixed with relative positioning */
.fline .sup {
    font-size: 0.52em;
    line-height: 0;
    position: relative;
    top: -0.62em;
}

.fdiv {
    width: 55%;
    height: 1px;
    background: #1e2535;
}

.cx  { color: #e06b6b; }
.cy  { color: #5b9cf6; }
.cr  { color: #f0c060; }
.cop { color: #3d4a66; margin: 0 0.12em; }
.cok { color: #4ade80; }
.cm  { color: #3d4a66; }

.skip-card {
    text-align: center;
    color: #3d4a66;
    font-style: italic;
    padding: 16px 0;
}
.skip-card b { color: #4a5a7a; font-style: normal; }
</style>
</head>
<body>

<!-- ── Nav at TOP ── -->
<div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)" disabled>← Prev</button>
    <div class="nav-center">
        <span class="step-badge" id="stepBadge">1 / 16</span>
        <div class="dots" id="dots"></div>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="go(1)">Next →</button>
</div>

<!-- ── Main split ── -->
<div class="main">
    <div class="left"><canvas id="canvas"></canvas></div>
    <div class="right">
        <div class="pt-label" id="ptLabel"></div>
        <div class="formula-wrap" id="fwrap"></div>
    </div>
</div>

<script>
const COLORS = { A:'#e06b6b', B:'#4ade80', C:'#5b9cf6', D:'#f0c060' };

const steps = [
    { base:'A', label:'A',    x: 5, y: 0, type:'Original',         skip:false },
    { base:'A', label:"A'",   x:-5, y: 0, type:'Reflect · y-axis', skip:false },
    { base:'A', label:"A''",  x: 5, y: 0, type:'Reflect · x-axis', skip:true,  why:'A is on x-axis → same point' },
    { base:'A', label:"A'''", x:-5, y: 0, type:'Reflect · origin',  skip:true,  why:"Same as A' — skip" },

    { base:'B', label:'B',    x: 4, y: 3, type:'Original',         skip:false },
    { base:'B', label:"B'",   x:-4, y: 3, type:'Reflect · y-axis', skip:false },
    { base:'B', label:"B''",  x: 4, y:-3, type:'Reflect · x-axis', skip:false },
    { base:'B', label:"B'''", x:-4, y:-3, type:'Reflect · origin',  skip:false },

    { base:'C', label:'C',    x: 3, y: 4, type:'Original',         skip:false },
    { base:'C', label:"C'",   x:-3, y: 4, type:'Reflect · y-axis', skip:false },
    { base:'C', label:"C''",  x: 3, y:-4, type:'Reflect · x-axis', skip:false },
    { base:'C', label:"C'''", x:-3, y:-4, type:'Reflect · origin',  skip:false },

    { base:'D', label:'D',    x: 0, y: 5, type:'Original',         skip:false },
    { base:'D', label:"D'",   x: 0, y: 5, type:'Reflect · y-axis', skip:true,  why:'D is on y-axis → same point' },
    { base:'D', label:"D''",  x: 0, y:-5, type:'Reflect · x-axis', skip:false },
    { base:'D', label:"D'''", x: 0, y:-5, type:'Reflect · origin',  skip:true,  why:"Same as D'' — skip" },
];

let cur = 0;
const drawn = new Set();
const pts = [];

function addPt(s) {
    if (s.skip) return;
    const k = `${s.x},${s.y}`;
    if (!drawn.has(k)) { drawn.add(k); pts.push(s); }
}

// ── Canvas ──
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
    const el = document.querySelector('.left');
    const size = Math.min(el.clientWidth, el.clientHeight) - 24;
    canvas.width = canvas.height = size;
    draw();
}
window.addEventListener('resize', resize);

function toC(x, y) {
    const s = canvas.width / 14;
    return { x: canvas.width/2 + x*s, y: canvas.height/2 - y*s };
}
function sc() { return canvas.width / 14; }

function draw() {
    const W = canvas.width, s = sc(), ox = W/2, oy = W/2;
    ctx.clearRect(0, 0, W, W);

    // bg
    ctx.fillStyle = '#0d0f14';
    ctx.fillRect(0, 0, W, W);

    // grid — subtle
    ctx.strokeStyle = '#141820'; ctx.lineWidth = 1;
    for (let i = -6; i <= 6; i++) {
        let a = toC(i,-6), b = toC(i,6);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        a = toC(-6,i); b = toC(6,i);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }

    // ── Outstanding axes with arrowheads ──
    const AX = 6.2;
    ctx.strokeStyle = '#3a5070'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(toC(-AX,0).x,oy); ctx.lineTo(toC(AX,0).x,oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox,toC(0,AX).y);  ctx.lineTo(ox,toC(0,-AX).y); ctx.stroke();

    // arrowheads
    const aw = 6, ah = 11; ctx.fillStyle = '#3a5070';
    ctx.beginPath(); ctx.moveTo(toC(AX,0).x,oy);  ctx.lineTo(toC(AX,0).x-ah,oy-aw);  ctx.lineTo(toC(AX,0).x-ah,oy+aw);  ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(toC(-AX,0).x,oy); ctx.lineTo(toC(-AX,0).x+ah,oy-aw); ctx.lineTo(toC(-AX,0).x+ah,oy+aw); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(ox,toC(0,AX).y);  ctx.lineTo(ox-aw,toC(0,AX).y+ah);  ctx.lineTo(ox+aw,toC(0,AX).y+ah);  ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(ox,toC(0,-AX).y); ctx.lineTo(ox-aw,toC(0,-AX).y-ah); ctx.lineTo(ox+aw,toC(0,-AX).y-ah); ctx.closePath(); ctx.fill();

    // axis letters
    ctx.font = `500 ${Math.max(11,s*0.42)}px 'JetBrains Mono',monospace`;
    ctx.fillStyle = '#5a7aaa'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('x', toC(AX,0).x+18, oy);
    ctx.fillText('y', ox, toC(0,AX).y-18);

    // tick numbers
    ctx.font = `${Math.max(8,s*0.32)}px 'JetBrains Mono',monospace`;
    ctx.fillStyle = '#2a3a55';
    for (let i=-5;i<=5;i++) {
        if (!i) continue;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(i, toC(i,0).x, oy+s*0.55);
        ctx.textAlign='right';
        ctx.fillText(i, ox-s*0.55, toC(0,i).y);
    }

    // ── Circle — doubled stroke, brighter ──
    ctx.beginPath(); ctx.arc(ox, oy, 5*s, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(91,156,246,0.65)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(91,156,246,0.05)'; ctx.fill();

    // r=5 label
    const rp = toC(3.6, 3.4);
    ctx.font = `italic ${Math.max(9,s*0.36)}px 'Lora',serif`;
    ctx.fillStyle = 'rgba(91,156,246,0.6)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('r = 5', rp.x, rp.y);

    // ── Legs for current step — doubled, brighter ──
    const st = steps[cur];
    if (!st.skip) {
        const cp = toC(st.x, st.y), fx = toC(st.x, 0);
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 3;
        // x leg
        ctx.strokeStyle = '#e06b6b88';
        ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(fx.x,oy); ctx.stroke();
        // y leg
        ctx.strokeStyle = '#5b9cf688';
        ctx.beginPath(); ctx.moveTo(fx.x,oy); ctx.lineTo(fx.x,cp.y); ctx.stroke();
        // hypotenuse / radius
        ctx.strokeStyle = COLORS[st.base] + '99';
        ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(cp.x,cp.y); ctx.stroke();
        ctx.setLineDash([]);
    }

    // ── Reflection connection lines — doubled, brighter ──
    // Group already-drawn points by base, connect same-base pairs
    const byBase = {};
    pts.forEach(p => {
        if (!byBase[p.base]) byBase[p.base] = [];
        byBase[p.base].push(p);
    });
    Object.entries(byBase).forEach(([base, bpts]) => {
        if (bpts.length < 2) return;
        const col = COLORS[base];
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = col + '55';
        ctx.lineWidth = 2;
        for (let a = 0; a < bpts.length; a++) {
            for (let b = a+1; b < bpts.length; b++) {
                const pa = toC(bpts[a].x, bpts[a].y);
                const pb = toC(bpts[b].x, bpts[b].y);
                ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
            }
        }
        ctx.setLineDash([]);
    });

    // ── Points ──
    pts.forEach((p, i) => {
        const cp = toC(p.x, p.y), col = COLORS[p.base], last = i === pts.length - 1;
        const r = last ? 9 : 6;
        if (last) {
            const g = ctx.createRadialGradient(cp.x,cp.y,0,cp.x,cp.y,26);
            g.addColorStop(0, col+'50'); g.addColorStop(1, col+'00');
            ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cp.x,cp.y,26,0,Math.PI*2); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(cp.x,cp.y,r,0,Math.PI*2);
        ctx.fillStyle = last ? col : col+'99';
        ctx.fill();
        ctx.strokeStyle = '#0d0f14'; ctx.lineWidth = 2.5; ctx.stroke();

        const fs = Math.max(9, s*0.36);
        ctx.font = `${last?600:400} ${fs}px 'JetBrains Mono',monospace`;
        const lx = cp.x + (p.x >= 0 ? r+6 : -(r+6));
        const ly = cp.y + (p.y >= 0 ? -(r+6) : r+6);
        ctx.textAlign = p.x >= 0 ? 'left' : 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = last ? col : col + '88';
        ctx.fillText(p.label, lx, ly);
    });

    // Origin O — always
    ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI*2);
    ctx.fillStyle = '#3a5070'; ctx.fill();
    ctx.strokeStyle = '#0d0f14'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = `400 ${Math.max(9,s*0.32)}px 'JetBrains Mono',monospace`;
    ctx.fillStyle = '#5a7aaa'; ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillText('O', ox-8, oy+6);
}

// ── Formula ──
// Builds superscripts properly using span.sup (relative top)
function sup(colorClass) {
    return `<span class="sup ${colorClass}">2</span>`;
}

function renderFormula() {
    const st = steps[cur];
    const col = COLORS[st.base];

    const lbl = document.getElementById('ptLabel');
    lbl.textContent = st.type;
    lbl.style.color = col + 'bb';

    const fw = document.getElementById('fwrap');
    fw.innerHTML = '';

    const fs = 'clamp(1.8rem, 4vw, 3.4rem)';

    if (st.skip) {
        fw.innerHTML = `
          <div class="fline" style="font-size:${fs}">
            <span style="color:${col};font-weight:600">${st.label}</span>
            <span class="cop">&nbsp;=&nbsp;</span>
            <span class="cm">(${st.x},&thinsp;${st.y})</span>
          </div>
          <div class="fdiv" style="margin:14px 0"></div>
          <div class="skip-card" style="font-size:clamp(0.95rem,2vw,1.3rem)">${st.why}</div>
        `;
        return;
    }

    const x2 = st.x * st.x, y2 = st.y * st.y;

    fw.innerHTML = `
      <div class="fline" style="font-size:${fs}">
        <span style="color:${col};font-weight:600">${st.label}</span>
        <span class="cop">&nbsp;=&nbsp;</span>
        <span class="cm">(</span><span class="cx">${st.x}</span><span class="cm">,&thinsp;</span><span class="cy">${st.y}</span><span class="cm">)</span>
      </div>
      <div class="fdiv"></div>

      <div class="fline" style="font-size:${fs}">
        <span class="cx">x</span>${sup('cx')}
        <span class="cop"> + </span>
        <span class="cy">y</span>${sup('cy')}
        <span class="cop"> = </span>
        <span class="cr">r</span>${sup('cr')}
      </div>
      <div class="fdiv"></div>

      <div class="fline" style="font-size:${fs}">
        <span class="cx">${st.x}</span>${sup('cx')}
        <span class="cop"> + </span>
        <span class="cy">${st.y}</span>${sup('cy')}
        <span class="cop"> = </span>
        <span class="cr">5</span>${sup('cr')}
      </div>
      <div class="fdiv"></div>

      <div class="fline" style="font-size:${fs}">
        <span class="cx">${x2}</span>
        <span class="cop"> + </span>
        <span class="cy">${y2}</span>
        <span class="cop"> = </span>
        <span class="cr">25</span>
        <span class="cop">&ensp;</span>
        <span class="cok">✓</span>
      </div>
    `;
}

// ── Dots ──
function renderDots() {
    const el = document.getElementById('dots');
    el.innerHTML = '';
    ['A','B','C','D'].forEach(b => {
        const grp = document.createElement('div');
        grp.className = 'dot-group';
        steps.forEach((s, i) => {
            if (s.base !== b) return;
            const d = document.createElement('div');
            d.className = 'dot' + (i === cur ? ' active' : '');
            d.style.background = i <= cur ? COLORS[b]+(i<cur?'55':'') : '#1e2535';
            grp.appendChild(d);
        });
        el.appendChild(grp);
    });
}

// ── Nav ──
function go(dir) {
    const next = cur + dir;
    if (next < 0 || next >= steps.length) return;
    cur = next;
    if (dir > 0) {
        addPt(steps[cur]);
    } else {
        drawn.clear(); pts.length = 0;
        for (let i = 0; i <= cur; i++) addPt(steps[i]);
    }
    draw(); renderFormula(); renderDots();
    document.getElementById('stepBadge').textContent = `${cur+1} / ${steps.length}`;
    document.getElementById('prevBtn').disabled = cur === 0;
    const nb = document.getElementById('nextBtn');
    nb.disabled = cur === steps.length - 1;
    nb.textContent = cur === steps.length - 1 ? 'Done ✓' : 'Next →';
}

document.addEventListener('keydown', e => {
    if (e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
    if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   go(-1);
});

// Init
addPt(steps[0]);
resize();
renderFormula();
renderDots();
</script>
</body>
</html>
