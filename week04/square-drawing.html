<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Function Animation - x²</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .function-box {
            width: 220px;
            height: 150px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border: 4px solid #2c3e50;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 2;
            transition: transform 0.1s ease;
        }

        .function-label {
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 8px;
        }

        .calc-display {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            background: rgba(255,255,255,0.92);
            padding: 6px 16px;
            border-radius: 8px;
            min-width: 80px;
            text-align: center;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .calc-display.pop {
            animation: calcPop 0.35s ease;
        }

        @keyframes calcPop {
            0% { transform: scale(0.7); opacity: 0.5; }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); opacity: 1; }
        }

        .arrow {
            width: 120px;
            height: 4px;
            background: #2c3e50;
            position: relative;
            flex-shrink: 0;
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -10px;
            top: -8px;
            width: 0;
            height: 0;
            border-left: 20px solid #2c3e50;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }

        .io-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            position: relative;
        }

        .value-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            height: 80px;
            justify-content: center;
        }

        .value-wrapper .label {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            margin-top: 10px;
        }

        .value {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .input-value {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        .output-value {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .moving-ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.35);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }

        .moving-ball.green { background: linear-gradient(135deg, #27ae60 0%, #229954 100%); }
        .moving-ball.blue { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }
        .moving-ball.orange { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            70% { transform: translate(-50%, -50%) scale(1.15); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .label {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
        }

        .step-indicator {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
        .btn:active { transform: translateY(0); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-play { background: linear-gradient(135deg, #27ae60 0%, #229954 100%); }
        .btn-pause { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); }
        .btn-stop { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:disabled:hover { transform: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* ===== Visual diagrams ===== */
        .visuals-area {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            margin-top: 40px;
            padding: 20px 20px 30px;
            border-top: 2px dashed #ccc;
            min-height: 300px;
        }

        .visual-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .visual-title {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Green line */
        .line-visual {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 260px;
        }

        .green-line {
            width: 10px;
            background: linear-gradient(to top, #27ae60, #2ecc71);
            border-radius: 5px;
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 2px 10px rgba(39, 174, 96, 0.4);
            position: relative;
        }

        .line-top-label {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 15px;
            font-weight: bold;
            color: #27ae60;
            white-space: nowrap;
            transition: opacity 0.5s;
        }

        /* Blue square */
        .square-visual {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 260px;
        }

        .blue-square {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border-radius: 6px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1), height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 3px 3px 14px rgba(52, 152, 219, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .square-center-label {
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-align: center;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
            transition: opacity 0.5s;
            line-height: 1.3;
        }

        .square-side-label {
            position: absolute;
            font-size: 13px;
            font-weight: bold;
            color: #2980b9;
            white-space: nowrap;
            transition: opacity 0.5s;
        }

        .square-side-label.right {
            right: -42px;
            top: 50%;
            transform: translateY(-50%);
        }

        .square-side-label.bottom {
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
        }

        .visual-arrow {
            font-size: 40px;
            color: #2c3e50;
            align-self: center;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="step-indicator" id="stepIndicator">Press Play to start</div>
        
        <div class="io-container" id="ioContainer">
            <div class="value-wrapper" id="inputWrapper">
                <div class="value input-value" id="inputValue">?</div>
                <div class="label">Input (x)</div>
            </div>
            <div class="arrow" id="arrow1"></div>
            <div class="function-box" id="functionBox">
                <div class="function-label">f(x) = x²</div>
                <div class="calc-display" id="calcDisplay">f(x) = x²</div>
            </div>
            <div class="arrow" id="arrow2"></div>
            <div class="value-wrapper" id="outputWrapper">
                <div class="value output-value" id="outputValue">?</div>
                <div class="label">Output (x²)</div>
            </div>
            <div class="moving-ball green" id="movingBall">0</div>
        </div>

        <!-- Visual diagrams -->
        <div class="visuals-area">
            <div class="visual-section">
                <div class="visual-title">Input: Side Length</div>
                <div class="line-visual">
                    <div class="green-line" id="greenLine" style="height: 0px;">
                        <span class="line-top-label" id="lineLabel" style="opacity:0;"></span>
                    </div>
                </div>
            </div>

            <div class="visual-arrow">→</div>

            <div class="visual-section">
                <div class="visual-title">Output: Area = x²</div>
                <div class="square-visual">
                    <div class="blue-square" id="blueSquare" style="width: 0px; height: 0px;">
                        <span class="square-center-label" id="squareCenterLabel" style="opacity:0;"></span>
                        <span class="square-side-label right" id="squareRightLabel" style="opacity:0;"></span>
                        <span class="square-side-label bottom" id="squareBottomLabel" style="opacity:0;"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-play" id="playBtn" onclick="play()">Play</button>
            <button class="btn btn-pause" id="pauseBtn" onclick="pause()" disabled>Pause</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stop()" disabled>Stop</button>
        </div>
    </div>

    <script>
        // 1 inch = 48px on screen
        const PX_PER_INCH = 48;

        // f(x) = x²
        const steps = [
            { input: 1, output: 1 },
            { input: 2, output: 4 },
            { input: 3, output: 9 },
            { input: 4, output: 16 },
            { input: 5, output: 25 }
        ];

        let currentStep = 0;
        let isPlaying = false;
        let animationInProgress = false;
        let timeouts = [];

        function clearAllTimeouts() {
            timeouts.forEach(t => clearTimeout(t));
            timeouts = [];
        }

        function addTimeout(fn, delay) {
            const t = setTimeout(fn, delay);
            timeouts.push(t);
            return t;
        }

        function getCenter(el) {
            const container = document.getElementById('ioContainer');
            const cRect = container.getBoundingClientRect();
            const eRect = el.getBoundingClientRect();
            return {
                x: eRect.left + eRect.width / 2 - cRect.left,
                y: eRect.top + eRect.height / 2 - cRect.top
            };
        }

        function setCalcText(text) {
            const calc = document.getElementById('calcDisplay');
            calc.textContent = text;
            calc.classList.remove('pop');
            requestAnimationFrame(() => { calc.classList.add('pop'); });
        }

        function showInputLine(val) {
            const line = document.getElementById('greenLine');
            const label = document.getElementById('lineLabel');
            line.style.height = (val * PX_PER_INCH) + 'px';
            label.textContent = val + ' in';
            label.style.opacity = '1';
        }

        function showOutputSquare(inputVal, outputVal) {
            const sq = document.getElementById('blueSquare');
            const center = document.getElementById('squareCenterLabel');
            const right = document.getElementById('squareRightLabel');
            const bottom = document.getElementById('squareBottomLabel');
            const side = inputVal * PX_PER_INCH;
            sq.style.width = side + 'px';
            sq.style.height = side + 'px';
            center.textContent = outputVal + ' in²';
            center.style.opacity = '1';
            right.textContent = inputVal + ' in';
            right.style.opacity = '1';
            bottom.textContent = inputVal + ' in';
            bottom.style.opacity = '1';
        }

        function hideVisuals() {
            document.getElementById('greenLine').style.height = '0px';
            document.getElementById('lineLabel').style.opacity = '0';
            document.getElementById('blueSquare').style.width = '0px';
            document.getElementById('blueSquare').style.height = '0px';
            document.getElementById('squareCenterLabel').style.opacity = '0';
            document.getElementById('squareRightLabel').style.opacity = '0';
            document.getElementById('squareBottomLabel').style.opacity = '0';
        }

        function animateStep() {
            if (animationInProgress) return;
            animationInProgress = true;

            const step = steps[currentStep];
            const ball = document.getElementById('movingBall');
            const inputEl = document.getElementById('inputValue');
            const outputEl = document.getElementById('outputValue');
            const stepEl = document.getElementById('stepIndicator');
            const functionBox = document.getElementById('functionBox');

            stepEl.textContent = `Step ${currentStep + 1}: Input ${step.input} → Output ?`;
            setCalcText('f(x) = x²');

            inputEl.textContent = step.input;
            inputEl.style.animation = 'none';
            requestAnimationFrame(() => { inputEl.style.animation = 'pulse 0.4s ease'; });

            // Show input green line, hide square
            showInputLine(step.input);
            document.getElementById('blueSquare').style.width = '0px';
            document.getElementById('blueSquare').style.height = '0px';
            document.getElementById('squareCenterLabel').style.opacity = '0';
            document.getElementById('squareRightLabel').style.opacity = '0';
            document.getElementById('squareBottomLabel').style.opacity = '0';

            const inputPos = getCenter(document.getElementById('inputWrapper'));
            const boxPos = getCenter(functionBox);
            const outputPos = getCenter(document.getElementById('outputWrapper'));

            // Phase 1: Green ball pops in
            ball.textContent = step.input;
            ball.className = 'moving-ball green';
            ball.style.transition = 'none';
            ball.style.left = inputPos.x + 'px';
            ball.style.top = inputPos.y + 'px';
            ball.style.opacity = '1';
            ball.style.animation = 'popIn 0.35s ease forwards';

            // Phase 2: Slide to box
            addTimeout(() => {
                ball.style.animation = '';
                ball.style.transform = 'translate(-50%, -50%) scale(1)';
                ball.style.transition = 'left 0.7s cubic-bezier(0.4,0,0.2,1), top 0.7s cubic-bezier(0.4,0,0.2,1)';
                ball.style.left = boxPos.x + 'px';
                ball.style.top = boxPos.y + 'px';
            }, 600);

            // Phase 3: Enter box
            addTimeout(() => {
                ball.className = 'moving-ball orange';
                ball.style.transition = 'transform 0.25s ease';
                ball.style.transform = 'translate(-50%, -50%) scale(0.4)';
                ball.style.opacity = '0.5';
                functionBox.style.transform = 'scale(1.06)';
                addTimeout(() => { functionBox.style.transform = 'scale(0.96)'; }, 100);
                addTimeout(() => { functionBox.style.transform = 'scale(1.02)'; }, 200);
                addTimeout(() => { functionBox.style.transform = 'scale(1)'; }, 300);
            }, 1500);

            // Phase 4: f(input)
            addTimeout(() => { setCalcText(`f(${step.input})`); }, 2000);

            // Phase 5: Show calculation
            addTimeout(() => { setCalcText(`${step.input}² = ${step.input} × ${step.input}`); }, 2700);

            // Phase 6: Show result
            addTimeout(() => {
                setCalcText(`= ${step.output}`);
                stepEl.textContent = `Step ${currentStep + 1}: Input ${step.input} → Output ${step.output}`;
            }, 3400);

            // Phase 7: Blue ball emerges + show square
            addTimeout(() => {
                ball.textContent = step.output;
                ball.className = 'moving-ball blue';
                ball.style.opacity = '1';
                ball.style.transition = 'transform 0.3s ease-out';
                ball.style.transform = 'translate(-50%, -50%) scale(1)';
                showOutputSquare(step.input, step.output);
            }, 4000);

            // Phase 8: Slide to output
            addTimeout(() => {
                ball.style.transition = 'left 0.7s cubic-bezier(0.4,0,0.2,1), top 0.7s cubic-bezier(0.4,0,0.2,1)';
                ball.style.left = outputPos.x + 'px';
                ball.style.top = outputPos.y + 'px';
            }, 4400);

            // Phase 9: Arrive
            addTimeout(() => {
                outputEl.textContent = step.output;
                outputEl.style.animation = 'none';
                requestAnimationFrame(() => { outputEl.style.animation = 'pulse 0.4s ease'; });
                ball.style.animation = 'popOut 0.3s ease forwards';
            }, 5300);

            // Phase 10: Reset & advance
            addTimeout(() => {
                ball.style.opacity = '0';
                ball.style.animation = '';
                setCalcText('f(x) = x²');
                animationInProgress = false;
                currentStep = (currentStep + 1) % steps.length;
                if (isPlaying) addTimeout(animateStep, 600);
            }, 5900);
        }

        function play() {
            if (!isPlaying) {
                isPlaying = true;
                document.getElementById('playBtn').disabled = true;
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('stopBtn').disabled = false;
                if (!animationInProgress) animateStep();
            }
        }

        function pause() {
            if (isPlaying) {
                isPlaying = false;
                document.getElementById('playBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
            }
        }

        function stop() {
            isPlaying = false;
            animationInProgress = false;
            clearAllTimeouts();
            currentStep = 0;

            const ball = document.getElementById('movingBall');
            ball.style.transition = 'none';
            ball.style.opacity = '0';
            ball.style.animation = '';

            document.getElementById('inputValue').textContent = '?';
            document.getElementById('outputValue').textContent = '?';
            document.getElementById('stepIndicator').textContent = 'Press Play to start';
            document.getElementById('functionBox').style.transform = 'scale(1)';
            document.getElementById('calcDisplay').textContent = 'f(x) = x²';
            document.getElementById('calcDisplay').classList.remove('pop');

            hideVisuals();

            document.getElementById('playBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('stopBtn').disabled = true;
        }
    </script>
</body>
</html>
