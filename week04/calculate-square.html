<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Square Area — f(x) = x²</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'DM Sans', sans-serif;
            padding: 30px 16px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 48px 36px;
            box-shadow: 0 24px 70px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
        }

        /* ── TITLE ── */
        .card-title {
            text-align: center;
            font-family: 'Nunito', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: #2c3e50;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }

        /* ── MACHINE ROW ── */
        .machine-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 36px;
        }

        .value-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .circle {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nunito', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: white;
            box-shadow: 0 6px 18px rgba(0,0,0,0.22);
        }

        .circle.green { background: linear-gradient(135deg, #27ae60, #219150); }
        .circle.blue  { background: linear-gradient(135deg, #3498db, #2074b0); }

        .val-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-align: center;
            line-height: 1.4;
        }
        .axis-hint {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            font-weight: 700;
        }

        .arrow {
            width: 72px;
            height: 4px;
            background: #2c3e50;
            position: relative;
            flex-shrink: 0;
            margin-bottom: 38px;
        }
        .arrow::after {
            content: '';
            position: absolute;
            right: -10px; top: -8px;
            border-left: 18px solid #2c3e50;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }

        /* ── FUNCTION BOX ── */
        .function-box {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: 4px solid #2c3e50;
            border-radius: 16px;
            padding: 18px 24px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-width: 220px;
            margin-bottom: 38px;
        }

        .fn-title {
            font-family: 'Nunito', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: white;
        }

        .fn-badge {
            background: rgba(255,255,255,0.93);
            border-radius: 10px;
            padding: 8px 18px;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: #2c3e50;
        }

        /* ── DIVIDER ── */
        .divider {
            border: none;
            border-top: 2px dashed #ddd;
            margin-bottom: 28px;
        }

        /* ══════════════════════════════════════════
           BOTTOM SECTION: visuals row + slider row
        ══════════════════════════════════════════ */

        /* Row 1: green line | arrow | blue square — all vertically centered */
        .visuals-row {
            display: flex;
            align-items: center;       /* vertical center */
            justify-content: center;
            gap: 32px;
            margin-bottom: 28px;
        }

        .visual-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .visual-label {
            font-size: 13px;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
        }

        /* ── Green line ── */
        .line-container {
            width: 50px;
            height: 260px;
            display: flex;
            align-items: center;       /* vertically center the line */
            justify-content: center;
            position: relative;
        }

        .green-line {
            width: 12px;
            background: linear-gradient(to top, #27ae60, #2ecc71);
            border-radius: 6px;
            transition: height 0.7s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 2px 2px 10px rgba(39,174,96,0.4);
            position: relative;
        }

        .line-top-label {
            position: absolute;
            top: -26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 700;
            color: #27ae60;
            white-space: nowrap;
        }

        /* ── Center arrow ── */
        .center-arrow {
            font-size: 34px;
            color: #2c3e50;
            flex-shrink: 0;
            /* no extra padding — flexbox handles vertical centering */
        }

        /* ── Blue square ── */
        .square-container {
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;       /* vertically center the square */
            justify-content: center;
            position: relative;
        }

        /* Question mark placeholder */
        .question-mark {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: linear-gradient(135deg, #3498db22, #3498db11);
            border: 3px dashed #3498db66;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nunito', sans-serif;
            font-size: 40px;
            font-weight: 900;
            color: #3498db88;
        }

        .blue-square {
            background: linear-gradient(135deg, #3498db, #2074b0);
            border-radius: 8px;
            transition: width 0.7s cubic-bezier(0.4,0,0.2,1), height 0.7s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 4px 4px 18px rgba(52,152,219,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: visible;
        }

        .sq-center-label {
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: white;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .sq-dim {
            position: absolute;
            font-size: 12px;
            font-weight: 700;
            color: #2074b0;
            white-space: nowrap;
        }
        .sq-dim.right  { right: -46px; top: 50%; transform: translateY(-50%); }
        .sq-dim.bottom { bottom: -24px; left: 50%; transform: translateX(-50%); }

        /* Row 2: slider — centered, on its own row */
        .slider-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .slider-label-row {
            display: flex;
            justify-content: space-between;
            width: 200px;
            font-size: 11px;
            font-weight: 700;
            color: #888;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 200px;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #27ae60 0%, #27ae60 calc((var(--val) - 1) / 4 * 100%), #ddd calc((var(--val) - 1) / 4 * 100%), #ddd 100%);
            outline: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #27ae60, #219150);
            box-shadow: 0 3px 10px rgba(39,174,96,0.5);
            cursor: pointer;
            transition: transform 0.2s;
        }

        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }

        input[type=range]::-moz-range-thumb {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #27ae60, #219150);
            cursor: pointer;
        }

        .slider-value-display {
            font-family: 'Nunito', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #27ae60;
        }

        .slider-unit {
            font-size: 12px;
            font-weight: 600;
            color: #888;
        }

        /* ── TOGGLE BUTTON ── */
        .controls {
            display: flex;
            justify-content: center;
        }

        .toggle-btn {
            padding: 14px 44px;
            font-family: 'Nunito', sans-serif;
            font-size: 18px;
            font-weight: 900;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #3498db, #2074b0);
            box-shadow: 0 6px 20px rgba(52,152,219,0.4);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            letter-spacing: 0.3px;
        }

        .toggle-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(52,152,219,0.5);
        }

        .toggle-btn:active { transform: translateY(0); }

        .toggle-btn.hide {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 0 6px 20px rgba(231,76,60,0.4);
        }

        .toggle-btn.hide:hover {
            box-shadow: 0 10px 28px rgba(231,76,60,0.5);
        }

        @keyframes pulse {
            0%   { transform: scale(0.9); }
            60%  { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 0.35s ease forwards; }
    </style>
</head>
<body>
<div class="card">
    <div class="card-title">Calculate Square Area — f(x) = x²</div>

    <!-- MACHINE ROW -->
    <div class="machine-row">
        <div class="value-wrapper">
            <div class="circle green" id="inputCircle">1</div>
            <div class="val-label">Input (x)<br><span class="axis-hint">x-axis</span></div>
        </div>

        <div class="arrow"></div>

        <div class="function-box">
            <div class="fn-title">f(x) = x²</div>
            <div class="fn-badge">Calculate Square Area</div>
        </div>

        <div class="arrow"></div>

        <div class="value-wrapper">
            <div class="circle blue" id="outputCircle">?</div>
            <div class="val-label">Output (x²)<br><span class="axis-hint">y-axis</span></div>
        </div>
    </div>

    <hr class="divider">

    <!-- ROW 1: Green line | arrow | Blue square — vertically centered -->
    <div class="visuals-row">

        <!-- Left: Side Length visual -->
        <div class="visual-col">
            <div class="visual-label">Side Length (x)</div>
            <div class="line-container">
                <div class="green-line" id="greenLine" style="height: 48px;">
                    <span class="line-top-label" id="lineLabel">1 in</span>
                </div>
            </div>
        </div>

        <!-- Center arrow -->
        <div class="center-arrow">→</div>

        <!-- Right: Area visual -->
        <div class="visual-col">
            <div class="visual-label">Area = x² (inches²)</div>
            <div class="square-container">
                <div id="questionMark" class="question-mark">?</div>
                <div id="blueSquare" class="blue-square" style="display:none; width:48px; height:48px;">
                    <span class="sq-center-label" id="sqCenter">1 in²</span>
                    <span class="sq-dim right" id="sqRight">1 in</span>
                    <span class="sq-dim bottom" id="sqBottom">1 in</span>
                </div>
            </div>
        </div>

    </div>

    <!-- ROW 2: Slider — its own centered row -->
    <div class="slider-row">
        <div class="slider-value-display" id="sliderDisplay">1 <span class="slider-unit">inch</span></div>
        <input type="range" id="sideSlider" min="1" max="5" step="1" value="1" style="--val:1">
        <div class="slider-label-row">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
        </div>
    </div>

    <!-- TOGGLE BUTTON -->
    <div class="controls">
        <button class="toggle-btn" id="toggleBtn" onclick="toggleArea()">Show Area</button>
    </div>
</div>

<script>
    const PX_PER_INCH = 48;
    let showArea = false;

    const slider       = document.getElementById('sideSlider');
    const inputCircle  = document.getElementById('inputCircle');
    const outputCircle = document.getElementById('outputCircle');
    const greenLine    = document.getElementById('greenLine');
    const lineLabel    = document.getElementById('lineLabel');
    const sliderDisp   = document.getElementById('sliderDisplay');
    const blueSquare   = document.getElementById('blueSquare');
    const sqCenter     = document.getElementById('sqCenter');
    const sqRight      = document.getElementById('sqRight');
    const sqBottom     = document.getElementById('sqBottom');
    const toggleBtn    = document.getElementById('toggleBtn');
    const questionMark = document.getElementById('questionMark');

    function updateAll() {
        const x  = parseInt(slider.value);
        const x2 = x * x;
        const px = x * PX_PER_INCH;

        slider.style.setProperty('--val', x);
        sliderDisp.innerHTML = `${x} <span class="slider-unit">inch${x > 1 ? 'es' : ''}</span>`;

        inputCircle.textContent = x;
        triggerPulse(inputCircle);

        greenLine.style.height = px + 'px';
        lineLabel.textContent  = `${x} in`;

        if (showArea) {
            outputCircle.textContent = x2;
            triggerPulse(outputCircle);

            blueSquare.style.width  = px + 'px';
            blueSquare.style.height = px + 'px';
            sqCenter.textContent    = `${x2} in²`;
            sqRight.textContent     = `${x} in`;
            sqBottom.textContent    = `${x} in`;
            sqCenter.style.fontSize = px < 80 ? '11px' : '16px';
        } else {
            outputCircle.textContent = '?';
        }
    }

    function toggleArea() {
        showArea = !showArea;

        if (showArea) {
            toggleBtn.textContent = 'Hide Area';
            toggleBtn.classList.add('hide');
            questionMark.style.display = 'none';
            blueSquare.style.display   = 'flex';
        } else {
            toggleBtn.textContent = 'Show Area';
            toggleBtn.classList.remove('hide');
            questionMark.style.display = 'flex';
            blueSquare.style.display   = 'none';
            outputCircle.textContent   = '?';
        }

        updateAll();
    }

    function triggerPulse(el) {
        el.classList.remove('pulse');
        void el.offsetWidth;
        el.classList.add('pulse');
        el.addEventListener('animationend', () => el.classList.remove('pulse'), { once: true });
    }

    slider.addEventListener('input', updateAll);
    updateAll();
</script>
</body>
</html>
